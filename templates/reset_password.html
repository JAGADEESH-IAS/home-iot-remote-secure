<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset Password | HomeIoT</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=34"></head><body class="auth-page"><main class="auth-container"><section class="auth-card"><div class="auth-brand"><div class="brand-icon">⌂</div><div><h1>HomeIoT</h1><p>Remote Control</p></div></div><div class="auth-heading"><p class="eyebrow">ACCOUNT RECOVERY</p><h2>Reset password</h2><p>Enter the code sent to {{ email }} and choose a new password.</p></div>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash-message {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('reset_password') }}"><label for="otp">Six-digit code</label><input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required><label for="password">New password</label><input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required><label for="confirm_password">Confirm new password</label><input id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required><button class="primary-button auth-submit" type="submit">Update password</button></form></section></main></body></html>
