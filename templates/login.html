<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | HomeIoT</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}?v=20"></head><body class="auth-page"><div class="auth-card"><a class="brand-mark" href="{{ url_for('home') }}"><span class="brand-icon">⌂</span>HomeIoT</a><h1 style="margin-top:25px">Welcome back</h1><p>Sign in to access your approved IoT dashboard.</p>{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next|default('') }}"><div class="form-group"><label>Username</label><input name="username" autocomplete="username" required></div><div class="form-group"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary full" type="submit">Sign In</button></form><div class="auth-links">New user? <a href="{{ url_for('signup') }}">Create an account</a></div></div></body></html>
