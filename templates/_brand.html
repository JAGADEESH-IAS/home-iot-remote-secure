{#- Brand mark + wordmark. Usage: {% from "_brand.html" import brand %} {{ brand() }} -#}
{% macro mark(size=28) -%}
<svg class="brand-mark" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2.5 12 12 3l9.5 9"/><path d="M5.5 10.5V21h13V10.5"/><circle cx="12" cy="15.2" r="2.2" fill="var(--ember)" stroke="none"/></svg>
{%- endmacro %}

{% macro brand(tagline=True) -%}
<span class="brand-lockup">
    {{ mark(30) }}
    <span class="brand-words">
        <span class="wordmark">HomeIoT</span>
        {% if tagline %}<span class="brand-tag">Remote Control</span>{% endif %}
    </span>
</span>
{%- endmacro %}
