<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | HomeIoT</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}?v=20"></head><body class="auth-page"><div class="auth-card"><a class="brand-mark" href="{{ url_for('home') }}"><span class="brand-icon">⌂</span>HomeIoT</a><h1 style="margin-top:25px">Create your account</h1><p>New accounts require administrator approval before they can access the dashboard.</p>{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-group"><label>Username</label><input name="username" minlength="3" maxlength="50" autocomplete="username" required></div><div class="form-group"><label>Password</label><input type="password" name="password" minlength="8" autocomplete="new-password" required></div><div class="form-group"><label>Confirm Password</label><input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary full" type="submit">Create Account</button></form><div class="auth-links">Already registered? <a href="{{ url_for('login') }}">Sign in</a></div></div></body></html>
