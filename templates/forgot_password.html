<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forgot Password | HomeIoT</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=34"></head><body class="auth-page"><main class="auth-container"><section class="auth-card"><div class="auth-brand"><div class="brand-icon">⌂</div><div><h1>HomeIoT</h1><p>Remote Control</p></div></div><div class="auth-heading"><p class="eyebrow">ACCOUNT RECOVERY</p><h2>Forgot password?</h2><p>Enter your account email to receive a reset code.</p></div>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash-message {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('forgot_password') }}"><label for="email">Email address</label><input id="email" type="email" name="email" value="{{ email|default('') }}" required><button class="primary-button auth-submit" type="submit">Send reset code</button></form><p><a href="{{ url_for('signin') }}">Back to sign in</a></p></section></main></body></html>
