<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify Email | HomeIoT</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=34"></head><body class="auth-page"><main class="auth-container"><section class="auth-card"><div class="auth-brand"><div class="brand-icon">⌂</div><div><h1>HomeIoT</h1><p>Remote Control</p></div></div><div class="auth-heading"><p class="eyebrow">EMAIL VERIFICATION</p><h2>Verify your email</h2><p>Enter the six-digit code sent to {{ email }}. It expires in 10 minutes.</p></div>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash-message {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('verify_signup_otp') }}"><label for="otp">Verification code</label><input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required><button class="primary-button auth-submit" type="submit">Verify and create account</button></form></section></main></body></html>
