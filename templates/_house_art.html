{#- Original line illustration of the three controlled appliances in a house
    section. Purely illustrative (no live data). Colours come from CSS:
    strokes use currentColor, the lit lamp uses --ember. -#}
<svg class="house-art" viewBox="0 0 560 420" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Line illustration of a house with a ceiling light, a ceiling fan and a water heater, with a wireless signal above the roof">
    <!-- wireless signal -->
    <g class="art-signal" stroke-width="1.75">
        <path d="M271.5 41.5A12 12 0 0 1 288.5 41.5"/>
        <path d="M263 33A24 24 0 0 1 297 33"/>
        <path d="M254.5 24.5A36 36 0 0 1 305.5 24.5"/>
        <circle cx="280" cy="52" r="3" fill="currentColor" stroke="none"/>
    </g>

    <!-- structure -->
    <path d="M70 196 280 66 490 196"/>
    <path d="M92 196V372M468 196V372M92 196H468M340 196V372"/>
    <path d="M30 372H530" stroke-width="2"/>

    <!-- living room: window + sofa -->
    <rect x="262" y="254" width="58" height="68" rx="3"/>
    <path d="M291 254v68M262 288h58"/>
    <path d="M112 372v-34a8 8 0 0 1 8-8h92a8 8 0 0 1 8 8v34"/>
    <path d="M112 352h108"/>

    <!-- light: glow + pendant -->
    <polygon class="art-cone" points="141,264 159,264 215,372 85,372" fill="var(--ember)" fill-opacity=".07" stroke="none"/>
    <circle cx="150" cy="254" r="40" fill="var(--ember)" fill-opacity=".08" stroke="none"/>
    <circle cx="150" cy="254" r="25" fill="var(--ember)" fill-opacity=".12" stroke="none"/>
    <path d="M150 196v42"/>
    <path d="M138 240h24"/>
    <circle cx="150" cy="254" r="12" fill="var(--ember)" stroke="var(--ember)"/>

    <!-- fan -->
    <path d="M250 196v22"/>
    <rect x="244" y="218" width="12" height="9" rx="2"/>
    <rect x="198" y="230" width="46" height="6" rx="3" transform="rotate(-4 221 233)"/>
    <rect x="256" y="230" width="46" height="6" rx="3" transform="rotate(4 279 233)"/>

    <!-- bathroom: tub + geyser -->
    <path d="M356 372v-24h92v24"/>
    <path d="M352 348h100"/>
    <rect x="386" y="224" width="40" height="78" rx="9"/>
    <path d="M406 250c7 8 10 13 10 18a10 10 0 0 1-20 0c0-5 3-10 10-18z"/>
    <path d="M396 302v16M416 302v10"/>

    <!-- markers -->
    <g class="art-marker" stroke-width="1.5">
        <circle cx="186" cy="254" r="9"/><text x="186" y="258" text-anchor="middle" stroke="none" fill="currentColor">1</text>
        <circle cx="221" cy="256" r="9"/><text x="221" y="260" text-anchor="middle" stroke="none" fill="currentColor">2</text>
        <circle cx="446" cy="262" r="9"/><text x="446" y="266" text-anchor="middle" stroke="none" fill="currentColor">3</text>
    </g>
</svg>
